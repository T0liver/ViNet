name: JVM tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  jvm-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37 build-tools;37.0.0

      - name: Run JVM unit tests
        run: ./gradlew :core-model:test :data:testDebugUnitTest
