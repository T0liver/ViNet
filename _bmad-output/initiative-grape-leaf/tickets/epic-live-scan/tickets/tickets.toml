title = "Refactor sweep"
description = "Cleanup only. Its scope is set at the start from plans and review notes this epic deferred. It adds no behavior."
verify = "The scripted box, the still-image boxes, and the parity check still pass."
covers = []
after = [1, 2, 3, 4, 5, 6, 7]
hitl = false
risk = "low"

[[entry]]
id = 9
type = "story"
title = "A sideloaded debug build shows a labeled box"
description = "The closing check for this epic. A debug build shows a labeled box from the stand-in path, and the JVM tests for the service, preprocess, and parity are green with no emulator. For R1 this is the installed overlay. For R2 this is the debug path that the release build does not contain."
verify = "Install the debug APK and see a labeled box. The JVM suite is green, and the release APK still has no model or HUD."
covers = ["R1", "R2"]
after = [8]
hitl = true
risk = "medium"
